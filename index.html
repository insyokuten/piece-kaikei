<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.json">

  <title>PIECE会計</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
      padding-bottom: 30px;
    }

    header {
      background: #1c1c1c;
      padding: 16px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 15px;
    }

    .menu button {
      min-height: 90px;
      border: none;
      border-radius: 12px;
      background: #292929;
      color: white;
      padding: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .menu button:active {
      transform: scale(0.96);
      background: #444;
    }

    .price {
      display: block;
      margin-top: 7px;
      font-size: 15px;
      font-weight: normal;
      color: #ccc;
    }

    .order {
      margin: 10px 15px;
      background: #1c1c1c;
      border-radius: 12px;
      padding: 15px;
    }

    .order h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .order-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid #333;
    }

    .item-name {
      flex: 1;
      font-size: 16px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity button {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    .quantity span {
      min-width: 25px;
      text-align: center;
      font-size: 18px;
    }

    .item-total {
      width: 80px;
      text-align: right;
      font-weight: bold;
    }

    .total {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px solid #555;
      display: flex;
      justify-content: space-between;
      font-size: 24px;
      font-weight: bold;
    }

    .reset {
      width: calc(100% - 30px);
      margin: 10px 15px;
      height: 55px;
      border: none;
      border-radius: 12px;
      background: #8b1e1e;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>

<body>

  <header>
    PIECE会計
  </header>

  <div class="menu" id="menu"></div>

  <div class="order">
    <h2>注文内容</h2>
    <div id="orderList">
      <div class="empty">商品をタップしてください</div>
    </div>

    <div class="total">
      <span>合計</span>
      <span id="total">¥0</span>
    </div>
  </div>

  <button class="reset" onclick="resetOrder()">
    会計をリセット
  </button>

  <script>
    const menuItems = [
      {
        id: "jerk-curry",
        name: "ジャークチキンカレー",
        price: 1000
      },
      {
        id: "adult-curry",
        name: "大人のカレー",
        price: 800
      },
      {
        id: "jerk-extra",
        name: "ジャークチキン増し",
        price: 300
      },
      {
        id: "spicy",
        name: "辛さ追加",
        price: 100
      },
      {
        id: "beer",
        name: "瓶ビール",
        price: 700
      },
      {
        id: "tequila",
        name: "テキーラ",
        price: 700
      },
      {
        id: "set",
        name: "アルコール＋ジャークチキン",
        price: 1200
      }
    ];

    let order = {};

    function yen(value) {
      return "¥" + value.toLocaleString("ja-JP");
    }

    function createMenu() {
      const menu = document.getElementById("menu");

      menu.innerHTML = "";

      menuItems.forEach(item => {
        const button = document.createElement("button");

        button.innerHTML = `
          ${item.name}
          <span class="price">${yen(item.price)}</span>
        `;

        button.addEventListener("click", () => {
          addItem(item.id);
        });

        menu.appendChild(button);
      });
    }

    function addItem(id) {
      if (!order[id]) {
        order[id] = 0;
      }

      order[id]++;
      renderOrder();
    }

    function changeQuantity(id, amount) {
      if (!order[id]) {
        return;
      }

      order[id] += amount;

      if (order[id] <= 0) {
        delete order[id];
      }

      renderOrder();
    }

    function renderOrder() {
      const orderList = document.getElementById("orderList");
      const totalElement = document.getElementById("total");

      orderList.innerHTML = "";

      let total = 0;
      let hasItems = false;

      menuItems.forEach(item => {
        const quantity = order[item.id] || 0;

        if (quantity > 0) {
          hasItems = true;

          const subtotal = item.price * quantity;
          total += subtotal;

          const row = document.createElement("div");
          row.className = "order-item";

          row.innerHTML = `
            <div class="item-name">
              ${item.name}
            </div>

            <div class="quantity">
              <button onclick="changeQuantity('${item.id}', -1)">−</button>
              <span>${quantity}</span>
              <button onclick="changeQuantity('${item.id}', 1)">＋</button>
            </div>

            <div class="item-total">
              ${yen(subtotal)}
            </div>
          `;

          orderList.appendChild(row);
        }
      });

      if (!hasItems) {
        orderList.innerHTML =
          '<div class="empty">商品をタップしてください</div>';
      }

      totalElement.textContent = yen(total);
    }

    function resetOrder() {
      order = {};
      renderOrder();
    }

    createMenu();
    renderOrder();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js")
          .catch(error => {
            console.log("Service Worker error:", error);
          });
      });
    }
  </script>

</body>
</html>
