<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="PIECE出店用の簡易会計アプリ">
  <link rel="manifest" href="manifest.json">
  <title>PIECE会計</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 140px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .reset {
      border: 0;
      background: #ddd;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .menu button {
      min-height: 80px;
      border: 0;
      border-radius: 14px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      text-align: left;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
    }

    .menu button:active {
      transform: scale(.97);
      background: #eee;
    }

    .price {
      display: block;
      margin-top: 6px;
      font-size: 14px;
      color: #666;
      font-weight: normal;
    }

    .order {
      margin-top: 18px;
      background: white;
      border-radius: 14px;
      padding: 16px;
    }

    .order h2 {
      font-size: 17px;
      margin: 0 0 12px;
    }

    .order-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .order-name {
      flex: 1;
      font-size: 14px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .controls button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: #eee;
      font-size: 20px;
    }

    .qty {
      min-width: 24px;
      text-align: center;
    }

    .total {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #111;
      color: white;
      padding: 16px;
      z-index: 10;
    }

    .total-inner {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-label {
      font-size: 14px;
    }

    .total-price {
      font-size: 30px;
      font-weight: bold;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>PIECE会計</h1>
    <button class="reset" id="reset">リセット</button>
  </header>

  <div class="menu">

      ジャークチキンカレー
      <span class="price">¥1,000</span>
    </button>

    <button data-name="大人のカレー" data-price="800">
      大人のカレー
      <span class="price">¥800</span>
    </button>

    <button data-name="ジャークチキン増し" data-price="300">
      ジャークチキン増し
      <span class="price">¥300</span>
    </button>

    <button data-name="辛さ追加" data-price="100">
      辛さ追加
      <span class="price">¥100</span>
    </button>

    <button data-name="瓶ビール" data-price="700">
      瓶ビール
      <span class="price">¥700</span>
    </button>

    <button data-name="テキーラ" data-price="700">
      テキーラ
      <span class="price">¥700</span>
    </button>

    <button data-name="アルコール＋ジャークチキンセット" data-price="1200">
      アルコール＋ジャークチキン
      <span class="price">¥1,200</span>
    </button>

  </div>
