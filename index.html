<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIECE会計</title>

<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:sans-serif;
}

header{
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  background:#222;
}

#menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:15px;
}

.menu-button{
  padding:20px 10px;
  border:0;
  border-radius:10px;
  background:#333;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.price{
  display:block;
  margin-top:6px;
  color:#ccc;
}

.order{
  margin:0 15px 15px;
  padding:15px;
  background:#222;
  border-radius:10px;
}

.order-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 0;
  border-bottom:1px solid #444;
}

.name{
  flex:1;
}

.qty button{
  width:35px;
  height:35px;
}

.total{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  font-size:24px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>PIECE会計</header>

<div id="menu"></div>

<div class="order">

<h2>注文内容</h2>

<div id="orderList">
商品をタップしてください
</div>

<div class="total">
<span>合計</span>
<span id="total">¥0</span>
</div>

</div>

<script>

const menuItems=[
  {
    id:"curry",
    name:"ジャークチキンカレー",
    price:1000
  },
  {
    id:"adult",
    name:"大人のカレー",
    price:800
  },
  {
    id:"extra",
    name:"ジャークチキン増し",
    price:300
  },
  {
    id:"spicy",
    name:"辛さ追加",
    price:100
  },
  {
    id:"beer",
    name:"瓶ビール",
    price:700
  },
  {
    id:"tequila",
    name:"テキーラ",
    price:700
  },
  {
    id:"set",
    name:"アルコール＋ジャークチキン",
    price:1200
  }
];

let order={};

function yen(n){
  return "¥"+n.toLocaleString("ja-JP");
}

function createMenu(){

  const menu=document.getElementById("menu");

  menu.innerHTML="";

  menuItems.forEach(item=>{

    const button=document.createElement("button");

    button.className="menu-button";

    button.innerHTML=
      item.name+
      '<span class="price">'+
      yen(item.price)+
      '</span>';

    button.onclick=function(){
      addItem(item.id);
    };

    menu.appendChild(button);

  });
}

function addItem(id){

  if(!order[id]){
    order[id]=0;
  }

  order[id]++;

  render();

}

function changeQuantity(id,value){

  order[id]+=value;

  if(order[id]<=0){
    delete order[id];
  }

  render();

}

function render(){

  const list=document.getElementById("orderList");

  list.innerHTML="";

  let total=0;
  let count=0;

  menuItems.forEach(item=>{

    const qty=order[item.id]||0;

    if(qty>0){

      count++;

      const subtotal=item.price*qty;

      total+=subtotal;

      const row=document.createElement("div");

      row.className="order-row";

      row.innerHTML=
        '<div class="name">'+
        item.name+
        '</div>'+
        '<div class="qty">'+
        '<button onclick="changeQuantity(\''+
        item.id+
        '\',-1)">−</button>'+
        '<span>'+qty+'</span>'+
        '<button onclick="changeQuantity(\''+
        item.id+
        '\',1)">＋</button>'+
        '</div>'+
        '<div>'+
        yen(subtotal)+
        '</div>';

      list.appendChild(row);

    }

  });

  if(count===0){
    list.textContent="商品をタップしてください";
  }

  document.getElementById("total").textContent=yen(total);

}

createMenu();

render();

</script>

</body>
</html>
